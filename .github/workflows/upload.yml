name: Check and Publish YouTube Videos

on:
  schedule:
    # هر چند ساعت که دوست داری تنظیم میشه (مثلا هر ۶ ساعت)
    - cron: '0 */6 * * *'
  workflow_dispatch: # امکان اجرای دستی از تب Actions

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Python Script
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python upload_from_rss.py
