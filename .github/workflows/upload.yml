name: انتشار خودکار پادکست

on:
  schedule:
    - cron: '0 8 * * *'  # ۸ صبح
    - cron: '0 16 * * *' # ۴ بعدازظهر
    - cron: '0 0 * * *'  # ۱۲ شب
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write # اجازه دسترسی برای آپدیت فایل‌ها

    steps:
      - name: دریافت فایل‌ها از مخزن
        uses: actions/checkout@v3

      # ... (بخش‌های نصب پایتون و کتابخانه‌ها مثل قبل) ...

      - name: اجرای اسکریپت اصلی
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$YOUTUBE_TOKEN_JSON" > token.json
          python upload_from_rss.py

      - name: تازه نگه داشتن مخزن (برای جلوگیری از غیرفعال شدن)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          date > keepalive.txt
          git add keepalive.txt
          git commit -m "Auto-update for keepalive" || echo "No changes to commit"
          git push
