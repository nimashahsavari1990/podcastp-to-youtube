name: Check and Publish YouTube Videos

on:
  schedule:
    # اجرای خودکار روزی 4 بار در ساعت‌های مشخص (ساعت 00:00، 06:00، 12:00 و 18:00 به وقت UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # امکان اجرای دستی از تب Actions

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # برای اینکه ربات اجازه کامیت کردن در ریپازیتوری را داشته باشد
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Python Script
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python upload_from_rss.py

      - name: Auto-commit to keep workflow active
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "action@github.com"
          
          # یک تغییر کوچک در یک فایل لاگ یا ساخت فایل تاییدیه برای جلوگیری از غیرفعال شدن گیت‌هاب
          date -u > last_run.txt
          git add last_run.txt
          git commit -m "🤖 Automated keep-alive commit: $(date -u)" || exit 0
          git push
